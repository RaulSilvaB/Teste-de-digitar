<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Digitação</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    
    <div id="menu">

        <h3>Níveis de Digitação</h3>

        <ul>
            <li>
                <a href="#" onclick="mudarNivel(1)">Nível 1</a>
            </li>

            <li>
                <a href="#" onclick="mudarNivel(2)">Nível 2</a>
            </li>
            
            <li>
                <a href="#" onclick="mudarNivel(3)">Nível 3</a>
            </li>
            
            <li>
                <a href="#" onclick="mudarNivel(4)">Nível 4</a>
            </li>

            
            <li>
                <a href="#" onclick="mudarNivel(5)">Nível 5</a>
            </li>
        </ul>

    </div>

    <div id="conteudo">

        <h1>Curso Avançado de Digitação</h1>

        <div id="texto">Escolha um nível para começar.</div>

        <input type="text" id="entrada" autofocus disabled>

        <div id="estatisticas">Letras corretas: <span id="contador-certo">0</span> | Letras erradas: <span id="contador-errado">0</span></div>
        
        <div id="tempo">Tempo restante: <span id="contador-tempo">60</span>s</div>

    </div>

    <script src="scripts.js"></script>

</body>
</html>
